name: QA Automation Pipeline

on:
  push:
    paths:
      - 'tests/**'
      - 'framework/**'
      - 'requirements.txt'
      - 'docker-compose.yml'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create report folder
        run: mkdir -p reports

      # ---------------------------
      # START DOCKER ENVIRONMENT
      # ---------------------------
      - name: Launch Environment (Docker + SSL)
        run: |
          mkdir -p certs
          openssl req -x509 -newkey rsa:4096 \
            -keyout certs/key.pem \
            -out certs/cert.pem \
            -sha256 -days 365 -nodes \
            -subj "/CN=localhost"

          docker compose up -d --build

          # Wait for API to be ready
          for i in {1..15}; do
            curl -k https://localhost:5000/health && break
            sleep 3
          done

      - name: Wait for Postgres
        run: |
          for i in {1..15}; do
            docker compose exec -T db pg_isready -U qauser && break
            sleep 3
          done

      # ---------------------------
      # VERIFY SYSTEM IS UP
      # ---------------------------
      - name: Test API endpoint
        run: curl -vk https://localhost:5000/chat

      # ---------------------------
      # FUNCTIONAL TESTS (PYTEST)
      # ---------------------------
      - name: Run Functional Tests
        env:
          PYTHONPATH: ${{ github.workspace }}
          DATABASE_URL: postgresql://qauser:qapassword@localhost:5432/qadb
        run: pytest tests --html=reports/report.html --self-contained-html

      # ---------------------------
      # PERFORMANCE TESTS (JMETER)
      # ---------------------------
      - name: Install JMeter
        run: |
          wget -q https://archive.apache.org/dist/jmeter/binaries/apache-jmeter-5.6.3.tgz
          tar -xzf apache-jmeter-5.6.3.tgz

      - name: Run Performance Tests
        run: |
          rm -rf reports/jmeter_dashboard

          ./apache-jmeter-5.6.3/bin/jmeter \
            -n \
            -t jmeter_test_plan.jmx \
            -l reports/results.jtl \
            -e \
            -o reports/jmeter_dashboard \
            -Djsse.enableSNIExtension=false \
            -Jsample_variables=prompt

      # ---------------------------
      # DEBUG OUTPUT
      # ---------------------------
      - name: Debug reports
        run: ls -R reports

      # ---------------------------
      # ARTIFACT UPLOAD
      # ---------------------------
      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-qa-reports
          path: |
            reports/report.html
            reports/jmeter_dashboard/
            reports/results.jtl
