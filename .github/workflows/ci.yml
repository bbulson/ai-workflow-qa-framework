name: QA Automation Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  qa-tests:
    runs-on: ubuntu-latest

    steps:
    # ─────────────────────────────────────────────────────────────────
    # SETUP
    # ─────────────────────────────────────────────────────────────────

    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET 8
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install Python dependencies
      run: |
        pip install -r requirements.txt
        pip install pytest-html

    - name: Restore .NET dependencies
      run: dotnet restore PlaywrightTests/PlaywrightTests.csproj

    - name: Build Playwright project
      run: dotnet build PlaywrightTests/PlaywrightTests.csproj --no-restore

    # libasound2 was renamed to libasound2t64 in Ubuntu 24.04 (Noble).
    # Install it manually so we can use `install chromium` without --with-deps.
    - name: Install Playwright system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libasound2t64

    - name: Install Playwright browsers
      run: pwsh PlaywrightTests/bin/Debug/net8.0/playwright.ps1 install chromium

    - name: Create report directories
      run: |
        mkdir -p reports/playwright
        mkdir -p reports/screenshots
        mkdir -p reports/traces
        mkdir -p reports/jmeter
        # data/ is mounted into flask-mock via docker-compose volume (./data:/app/data)
        # and also used directly by pytest for log_test_result writes.
        # Must exist before Docker starts — the volume mount will shadow the
        # RUN mkdir inside the Dockerfile if the host directory is missing.
        mkdir -p data
        chmod 777 data
        # Pre-initialise the DB schema on the host so the mounted file
        # already has the test_results table when flask-mock starts.
        python3 -c "from framework.db import init_db; init_db('data/qa_results.db')"
        chmod 664 data/qa_results.db
        chmod 775 data/

    # ─────────────────────────────────────────────────────────────────
    # INFRASTRUCTURE — SSL + Docker (both ports 5000 and 5001)
    # ─────────────────────────────────────────────────────────────────

    - name: Generate SSL certs & launch Docker
      run: |
        mkdir -p certs
        openssl req -x509 -newkey rsa:4096 \
          -keyout certs/key.pem \
          -out certs/cert.pem \
          -sha256 -days 365 -nodes \
          -subj "/CN=localhost"
        docker compose up -d --build
        # Wait for mock server (pytest + Playwright)
        echo "Waiting for mock server on :5000..."
        for i in {1..20}; do
          curl -sk https://localhost:5000/health && break
          sleep 3
        done
        # Wait for local AI server (JMeter)
        echo "Waiting for local AI server on :5001..."
        for i in {1..20}; do
          curl -sk https://localhost:5001/health && break
          sleep 3
        done

    - name: Wait for Postgres
      run: |
        for i in {1..15}; do
          docker compose exec -T db pg_isready -U qauser && break
          sleep 3
        done

    - name: Verify servers
      run: |
        curl -vk https://localhost:5000/health
        curl -vk https://localhost:5001/health

    # ─────────────────────────────────────────────────────────────────
    # PYTEST FUNCTIONAL TESTS
    # ─────────────────────────────────────────────────────────────────

    - name: Run pytest functional tests
      env:
        PYTHONPATH: ${{ github.workspace }}
        DATABASE_URL: postgresql://qauser:qapassword@localhost:5432/qadb
        TEST_MODE: mock
      run: |
        pytest tests/ \
          --html=reports/pytest-report.html \
          --self-contained-html \
          -s
      continue-on-error: true

    # ─────────────────────────────────────────────────────────────────
    # PLAYWRIGHT TESTS
    # Screenshots and traces are written by TestBase.cs TearDown to
    # NUnit's WorkDirectory (bin/Debug/net8.0/reports/). The collect
    # step below copies them into reports/ for the unified artifact.
    # ─────────────────────────────────────────────────────────────────

    - name: Run Playwright API tests
      env:
        BASE_URL: https://localhost:5000
      run: |
        dotnet test PlaywrightTests/PlaywrightTests.csproj \
          --no-build \
          --filter "Category=API" \
          --logger "trx;LogFileName=${{ github.workspace }}/reports/playwright/api-results.trx" \
          --settings PlaywrightTests/.runsettings
      continue-on-error: true

    - name: Run Playwright health tests
      env:
        BASE_URL: https://localhost:5000
      run: |
        dotnet test PlaywrightTests/PlaywrightTests.csproj \
          --no-build \
          --filter "Category=Health" \
          --logger "trx;LogFileName=${{ github.workspace }}/reports/playwright/health-results.trx" \
          --settings PlaywrightTests/.runsettings
      continue-on-error: true

    - name: Run Playwright edge case tests
      env:
        BASE_URL: https://localhost:5000
      run: |
        dotnet test PlaywrightTests/PlaywrightTests.csproj \
          --no-build \
          --filter "Category=EdgeCases" \
          --logger "trx;LogFileName=${{ github.workspace }}/reports/playwright/edge-results.trx" \
          --settings PlaywrightTests/.runsettings
      continue-on-error: true

    - name: Run Playwright workflow tests
      env:
        BASE_URL: https://localhost:5000
      run: |
        dotnet test PlaywrightTests/PlaywrightTests.csproj \
          --no-build \
          --filter "Category=Workflows" \
          --logger "trx;LogFileName=${{ github.workspace }}/reports/playwright/workflow-results.trx" \
          --settings PlaywrightTests/.runsettings
      continue-on-error: true

    # Copy screenshots and traces from NUnit's WorkDirectory (bin/Debug/net8.0/reports/)
    # into reports/ so they are included in the unified dashboard artifact.
    - name: Collect Playwright artifacts
      if: always()
      run: |
        BIN="PlaywrightTests/bin/Debug/net8.0/reports"

        SRC="$BIN/screenshots"
        if [ -d "$SRC" ] && [ "$(ls -A "$SRC" 2>/dev/null)" ]; then
          cp -r "$SRC"/. reports/screenshots/
          echo "Copied $(ls reports/screenshots | wc -l) screenshots"
        else
          echo "No screenshots found in $SRC"
        fi

        SRC="$BIN/traces"
        if [ -d "$SRC" ] && [ "$(ls -A "$SRC" 2>/dev/null)" ]; then
          cp -r "$SRC"/. reports/traces/
          echo "Copied $(ls reports/traces | wc -l) traces"
        else
          echo "No traces found in $SRC"
        fi

    # ─────────────────────────────────────────────────────────────────
    # JMETER PERFORMANCE TESTS
    # Plan is jmeter_test_plan.jmx at repo root, hits port 5001.
    # ─────────────────────────────────────────────────────────────────

    - name: Cache JMeter
      id: cache-jmeter
      uses: actions/cache@v4
      with:
        path: apache-jmeter-5.6.3
        key: jmeter-5.6.3

    - name: Install JMeter
      if: steps.cache-jmeter.outputs.cache-hit != 'true'
      run: |
        wget -q https://archive.apache.org/dist/jmeter/binaries/apache-jmeter-5.6.3.tgz
        tar -xzf apache-jmeter-5.6.3.tgz

    - name: Run JMeter performance tests
      run: |
        ./apache-jmeter-5.6.3/bin/jmeter \
          -n \
          -t jmeter_test_plan.jmx \
          -l reports/jmeter/results.jtl \
          -e \
          -o reports/jmeter \
          -JBASE_URL=https://localhost:5001 \
          -Djsse.enableSNIExtension=false \
          -Jsample_variables=prompt
      continue-on-error: true

    # ─────────────────────────────────────────────────────────────────
    # DASHBOARD — embed screenshots inline, link trace zips
    # ─────────────────────────────────────────────────────────────────

    - name: Generate QA dashboard
      if: always()
      run: |
        # Build screenshot img tags (base64-embedded so they render from a local zip)
        SCREENSHOT_HTML=""
        for f in reports/screenshots/*.png; do
          [ -f "$f" ] || continue
          name=$(basename "$f")
          b64=$(base64 -w 0 "$f")
          SCREENSHOT_HTML+="<div class='screenshot'><p>$name</p><img src='data:image/png;base64,$b64'></div>"
        done
        if [ -z "$SCREENSHOT_HTML" ]; then
          SCREENSHOT_HTML="<p>No screenshots captured (all tests passed or server unreachable).</p>"
        fi

        # Build trace download links
        TRACE_HTML=""
        for f in reports/traces/*.zip; do
          [ -f "$f" ] || continue
          name=$(basename "$f")
          TRACE_HTML+="<li><a href='traces/$name'>$name</a> &nbsp;<small style='color:#777'>(open with: <code>playwright show-trace $name</code>)</small></li>"
        done
        if [ -z "$TRACE_HTML" ]; then
          TRACE_HTML="<li>No traces captured (no failures and no AlwaysTrace tests ran).</li>"
        fi

        cat > reports/dashboard.html << DASHBOARD
        <!DOCTYPE html>
        <html lang="en">
        <head>
          <meta charset="UTF-8">
          <title>QA Automation Dashboard</title>
          <style>
            body { font-family: Arial, sans-serif; margin: 40px; background: #f9f9f9; color: #333; }
            h1 { color: #2c3e50; border-bottom: 2px solid #2c3e50; padding-bottom: 10px; }
            h2 { color: #34495e; margin-top: 0; }
            .card {
              background: #fff;
              border: 1px solid #ddd;
              border-radius: 8px;
              padding: 20px;
              margin: 15px 0;
              box-shadow: 0 1px 4px rgba(0,0,0,0.06);
            }
            a { color: #2980b9; text-decoration: none; font-weight: bold; }
            a:hover { text-decoration: underline; }
            .screenshot { display: inline-block; margin: 8px; text-align: center; vertical-align: top; }
            .screenshot p { font-size: 11px; margin: 4px 0; word-break: break-all; max-width: 320px; }
            .screenshot img { max-width: 320px; border: 1px solid #ccc; border-radius: 4px; display: block; }
            code { background: #f0f0f0; padding: 2px 6px; border-radius: 3px; font-size: 12px; }
            ul { margin: 4px 0; padding-left: 20px; }
            li { margin: 6px 0; }
          </style>
        </head>
        <body>
          <h1>AI Workflow QA Framework — Test Dashboard</h1>

          <div class="card">
            <h2>Functional Tests (pytest)</h2>
            <a href="pytest-report.html">Open Pytest HTML Report</a>
          </div>

          <div class="card">
            <h2>Playwright UI / API Tests</h2>
            <a href="playwright/api-results.trx">API Results (TRX)</a><br><br>
            <a href="playwright/health-results.trx">Health Results (TRX)</a><br><br>
            <a href="playwright/edge-results.trx">Edge Case Results (TRX)</a><br><br>
            <a href="playwright/workflow-results.trx">Workflow Results (TRX)</a>
          </div>

          <div class="card">
            <h2>Playwright Screenshots (on failure)</h2>
            $SCREENSHOT_HTML
          </div>

          <div class="card">
            <h2>Playwright Traces</h2>
            <p style="color:#777;font-size:13px">Download a trace zip and open it locally with: <code>playwright show-trace &lt;file&gt;.zip</code></p>
            <ul>$TRACE_HTML</ul>
          </div>

          <div class="card">
            <h2>Performance Testing (JMeter)</h2>
            <a href="jmeter/index.html">Open JMeter Dashboard</a>
          </div>
        </body>
        </html>
        DASHBOARD

    # ─────────────────────────────────────────────────────────────────
    # DEBUG & UPLOAD
    # ─────────────────────────────────────────────────────────────────

    - name: Print generated reports
      if: always()
      run: ls -R reports

    # Single unified artifact — dashboard.html links to everything
    # inside the same zip so all relative paths resolve correctly.
    - name: Upload unified QA dashboard
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: qa-test-dashboard
        path: reports
