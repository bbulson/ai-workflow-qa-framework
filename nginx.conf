events {}

http {

    # ── Upstream: mock server (pytest + Playwright) ──────────────
    upstream flask_mock_backend {
        server flask-mock:5000;
    }

    # ── Upstream: local AI server (JMeter) ──────────────────────
    upstream flask_ai_backend {
        server flask-ai:5001;
    }

    # ── Port 443 → mock server (pytest + Playwright UI tests) ───
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        server_name localhost 127.0.0.1;

        ssl_certificate     /etc/nginx/certs/cert.pem;
        ssl_certificate_key /etc/nginx/certs/key.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        location / {
            proxy_pass http://flask_mock_backend;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
            proxy_connect_timeout 10s;
        }
    }

    # ── Port 5443 → local AI server (JMeter load tests) ─────────
    server {
        listen 5443 ssl;
        listen [::]:5443 ssl;
        server_name localhost 127.0.0.1;

        ssl_certificate     /etc/nginx/certs/cert.pem;
        ssl_certificate_key /etc/nginx/certs/key.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        location / {
            proxy_pass http://flask_ai_backend;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
            proxy_connect_timeout 10s;
        }
    }
}
