services:

  # ── Mock server (2 replicas) ────────────────────────────────────
  # Two nodes sit behind nginx, which round-robins requests across them.
  # Both write to the same Postgres instance — E2E tests verify that data
  # committed by one node is immediately visible from the other, confirming
  # cross-node persistence and integrity under concurrent load.
  # Accessible via nginx on https://localhost:5000 (→ port 443)
  flask-mock:
    build:
      context: .
      dockerfile: mock_server/Dockerfile
    expose:
      - "5000"
    environment:
      - PYTHONPATH=/app
      - DATABASE_URL=postgresql://qauser:qapassword@db:5432/qadb
    volumes:
      - ./data:/app/data   # shared with host so pytest can read DB writes
    depends_on:
      db:
        condition: service_healthy   # wait for Postgres to be ready
    restart: always

  flask-mock-2:
    build:
      context: .
      dockerfile: mock_server/Dockerfile
    expose:
      - "5000"
    environment:
      - PYTHONPATH=/app
      - DATABASE_URL=postgresql://qauser:qapassword@db:5432/qadb
    volumes:
      - ./data:/app/data
    depends_on:
      db:
        condition: service_healthy
    restart: always

  # ── Local AI server ─────────────────────────────────────────────
  # Targets: JMeter load/performance tests ONLY
  # Higher token limit (50k), returns status+response fields
  # Accessible via nginx on https://localhost:5001 (→ port 5443)
  flask-ai:
    build:
      context: .
      dockerfile: local_ai_server_docker/Dockerfile
    expose:
      - "5001"
    environment:
      - PYTHONPATH=/app
    restart: always

  # ── Nginx reverse proxy ─────────────────────────────────────────
  # Port 5000 (host) → 443 (nginx) → flask-mock  (pytest + Playwright)
  # Port 5001 (host) → 5443 (nginx) → flask-ai   (JMeter)
  nginx:
    image: nginx:latest
    ports:
      - "5000:443"
      - "5001:5443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - flask-mock
      - flask-ai
    restart: always

  # ── Postgres ────────────────────────────────────────────────────
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: qauser
      POSTGRES_PASSWORD: qapassword
      POSTGRES_DB: qadb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qauser -d qadb"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
